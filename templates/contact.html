{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6" id="contact">
        <div class="card shadow-lg p-4 mt-4">
            <h4 class="text-info mb-3"><i class="bi bi-headset me-2"></i>Get in Touch</h4>
            <hr>
            <p class="mb-3">
                <i class="bi bi-telephone-fill text-info me-2"></i>
                <strong>Phone:</strong><br>
                <span class="text-light ms-4">{{ contact.phone }}</span>
            </p>
            <p class="mb-3">
                <i class="bi bi-envelope-fill text-info me-2"></i>
                <strong>Email:</strong><br>
                <span class="text-light ms-4">{{ contact.email }}</span>
            </p>
            <p class="mb-0">
                <i class="bi bi-geo-alt-fill text-info me-2"></i>
                <strong>Address:</strong><br>
                <span class="text-light ms-4">{{ contact.address }}</span>
            </p>
        </div>
    </div>
</div>
{% endblock %}
