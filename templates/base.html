<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreX Solutions - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #070b18;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(14, 165, 233, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.05) 0%, transparent 40%);
            color: #e2e8f0;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        .navbar {
            background: rgba(8, 14, 30, 0.9) !important;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(14, 165, 233, 0.2);
            padding: 12px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1050;
        }

        .main-content-wrapper {
            padding-top: 130px;
            padding-bottom: 50px;
            position: relative;
            z-index: 10;
        }

        .navbar-brand-custom {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            border: 1px solid rgba(14, 165, 233, 0.4);
            object-fit: contain; 
            padding: 4px;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .brand-corex {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
        }

        .brand-solutions {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .glass-tab {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.75) 0%, rgba(15, 23, 42, 0.85) 100%);
            border: 1px solid rgba(14, 165, 233, 0.3);
            color: #cbd5e1;
            padding: 9px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
            transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        .glass-tab:hover {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.3) 0%, rgba(30, 41, 59, 0.8) 100%);
            color: #00f2fe;
            border-color: rgba(14, 165, 233, 0.7);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 25px rgba(0, 242, 254, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        .wordart-x {
            font-weight: 900;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #00c6ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 2px 10px rgba(0, 242, 254, 0.5);
            display: inline-block;
            transform: scale(1.1);
        }

        .card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid rgba(14, 165, 233, 0.25);
            color: #ffffff;
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(14, 165, 233, 0.25);
        }

        .form-control {
            background-color: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(14, 165, 233, 0.3);
            color: #ffffff;
            border-radius: 10px;
        }
        .form-control:focus {
            background-color: rgba(15, 23, 42, 0.95);
            border-color: #0ea5e9;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand-custom" href="/">
                <img src="https://zlquamdyrewvwjbnalpz.supabase.co/storage/v1/object/public/corexsolutions/logo%20(1).webp" alt="CoreX Logo" style="height: 55px; width: 60px; object-fit: cover; border-radius: 18%;">
                <div class="brand-text">
                    <span class="brand-corex">Core<span class="wordart-x">X</span></span>
                    <span class="brand-solutions">Solutions</span>
                </div>
            </a>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-2 mt-3 mt-lg-0">
                    <li class="nav-item">
                        <a class="glass-tab" href="/"><i class="bi bi-house-door-fill me-1"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="glass-tab" href="/#our-services"><i class="bi bi-gear-fill me-1"></i> Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="glass-tab" href="/#contact-section"><i class="bi bi-envelope-fill me-1"></i> Contact Us</a>
                    </li>
                    <!-- Dedicated Announcements Page Link -->
                    <li class="nav-item">
                        <a class="glass-tab text-info border-info" href="/announcements"><i class="bi bi-megaphone-fill me-1"></i> Announcements</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a class="glass-tab text-info border-info" href="/login"><i class="bi bi-speedometer2 me-1"></i> Admin Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content-wrapper container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
