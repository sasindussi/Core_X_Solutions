{% extends "base.html" %}

{% block content %}
<style>
    .form-control::placeholder {
        color: #94a3b8 !important;
        opacity: 1;
    }
</style>

<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="col-md-5 col-lg-4">
        <!-- 3D Glass Register Card -->
        <div class="card p-4 border-secondary border-opacity-25 shadow-lg" style="background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-radius: 20px;">
            <div class="text-center mb-4">
                <div class="mb-3 text-info fs-1">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h3 class="fw-bold text-white">Add New <span class="text-info">Admin</span></h3>
                <p class="text-light mb-0" style="opacity: 0.9; font-size: 0.9rem;">Create a new administrator account</p>
            </div>

            <!-- Add Admin Form -->
            <form method="POST" action="/add-admin">
                <div class="mb-3">
                    <label for="username" class="form-label text-light fw-semibold" style="font-size: 0.9rem;">Admin Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary text-info">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0 text-white" id="username" name="username" placeholder="Enter admin username" required style="background: rgba(15, 23, 42, 0.85);">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-light fw-semibold" style="font-size: 0.9rem;">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary text-info">
                            <i class="bi bi-key-fill"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 ps-0 text-white" id="password" name="password" placeholder="Enter secure password" required style="background: rgba(15, 23, 42, 0.85);">
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-info py-2.5 rounded-pill fw-semibold text-dark shadow-lg" style="background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); border: none;">
                        <i class="bi bi-check-circle-fill me-2"></i> Create Admin Account
                    </button>
                </div>
            </form>

            <div class="text-center mt-2">
                <a href="/login" class="text-light text-decoration-none fw-semibold" style="font-size: 0.85rem; opacity: 0.85;">
                    <i class="bi bi-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
