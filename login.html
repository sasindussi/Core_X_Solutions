{% extends "base.html" %}

{% block content %}
<style>
    .form-control::placeholder {
        color: #94a3b8 !important;
        opacity: 1;
    }
</style>

<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="col-md-5 col-lg-4">
        <!-- 3D Glass Login Card -->
        <div class="card p-4 border-secondary border-opacity-25 shadow-lg" style="background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-radius: 20px;">
            <div class="text-center mb-4">
                <div class="mb-3 text-info fs-1">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h3 class="fw-bold text-white">Admin <span class="text-info">Login</span></h3>
                <p class="text-light mb-0" style="opacity: 0.9; font-size: 0.9rem;">Sign in to access the management portal</p>
            </div>

            <!-- Red Color Error Alert (Waradi user/pass dunnoth meka pennai) -->
            {% if error %}
            <div class="alert alert-danger d-flex align-items-center py-2 px-3 mb-3 border-0 shadow-sm" role="alert" style="background: rgba(239, 68, 68, 0.15); color: #f87171; border-left: 4px solid #ef4444 !important; border-radius: 10px; font-size: 0.9rem;">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2 fs-5"></i>
                <div>
                    {{ error }}
                </div>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" action="/login">
                <div class="mb-3">
                    <label for="username" class="form-label text-light fw-semibold" style="font-size: 0.9rem;">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary text-info">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0 text-white" id="username" name="username" placeholder="Enter username" required style="background: rgba(15, 23, 42, 0.85);">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-light fw-semibold" style="font-size: 0.9rem;">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary text-info">
                            <i class="bi bi-key-fill"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 ps-0 text-white" id="password" name="password" placeholder="Enter password" required style="background: rgba(15, 23, 42, 0.85);">
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-info py-2.5 rounded-pill fw-semibold text-dark shadow-lg" style="background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); border: none;">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Login to Dashboard
                    </button>
                </div>
            </form>

            <div class="text-center mt-3">
                <a href="/" class="text-info text-decoration-none fw-semibold" style="font-size: 0.9rem;">
                    <i class="bi bi-arrow-left me-1"></i> Back to Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
